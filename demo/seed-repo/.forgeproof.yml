allowed_paths:
  - "src/**/*.py"
  - "tests/**/*.py"

denied_paths:
  - ".env"
  - ".gitlab-ci.yml"

evaluation:
  commands:
    - name: tests
      run: "python -m pytest -q"
      required: true
    - name: lint
      run: "python -m ruff check ."
      required: true

gates:
  all_required_commands_pass: true
  requirements_coverage_min: 80

signing:
  key_path: "devkey.ed25519"
  policy_profile: "P2"
