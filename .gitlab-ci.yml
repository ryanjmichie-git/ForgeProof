stages:
  - test
  - build
  - publish
  - run

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # Pre-built Docker image (public registry, works in both personal and hackathon repos)
  FORGEPROOF_IMAGE: "registry.gitlab.com/ryanjmichie1/forgeproof:latest"

# ---------------------------------------------------------------------------
# Hackathon-compatible job: matches the policy-allowed job name.
# When ISSUE_IID is set, runs the full ForgeProof pipeline.
# When ISSUE_IID is not set, runs basic tests.
# This job works in both the hackathon repo (policy allows it)
# and the personal project (runs alongside other jobs).
# ---------------------------------------------------------------------------

placeholder-test:
  stage: test
  image:
    name: $FORGEPROOF_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - cd /app
    - |
      if [ -n "$ISSUE_IID" ]; then
        echo "=== ForgeProof Agent Run (issue #$ISSUE_IID) ==="
        python -m forgeproof.main run --issue-iid $ISSUE_IID --verbose --json || echo "ForgeProof exited with code $? (non-review-ready is expected)"
        cp -f /app/*.rpack "$CI_PROJECT_DIR/" 2>/dev/null || true
        cp -f /tmp/forgeproof_run_*/*.rpack "$CI_PROJECT_DIR/" 2>/dev/null || true
        ls -la "$CI_PROJECT_DIR/"*.rpack 2>/dev/null || echo "No .rpack artifact found"
      else
        echo "=== ForgeProof Test Suite ==="
        python -m pytest tests/ -q --tb=short
        python -m ruff check src/
      fi
  artifacts:
    paths:
      - "*.rpack"
    when: always
    expire_in: 30 days
  allow_failure: true

# ---------------------------------------------------------------------------
# Personal project jobs (below). These run on the personal project but are
# overridden by the hackathon Pipeline Execution Policy on the hackathon repo.
# ---------------------------------------------------------------------------

test:
  stage: test
  image: python:3.11-slim
  cache:
    paths:
      - .pip-cache/
  before_script:
    - pip install -e ".[dev]"
  script:
    - python -m pytest tests/ -q --tb=short
    - python -m ruff check src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish-agent:
  stage: publish
  image: alpine:latest
  script:
    - echo "Agent image published as $FORGEPROOF_IMAGE"
    - echo "Register in GitLab AI Catalog via Settings > AI Agents"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

forgeproof-run:
  stage: run
  image:
    name: $FORGEPROOF_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - cd /app
    - python -m forgeproof.main run --issue-iid $ISSUE_IID --verbose --json || echo "ForgeProof exited with code $? (non-review-ready is expected)"
    - cp -f /app/*.rpack "$CI_PROJECT_DIR/" 2>/dev/null || true
    - cp -f /tmp/forgeproof_run_*/*.rpack "$CI_PROJECT_DIR/" 2>/dev/null || true
    - ls -la "$CI_PROJECT_DIR/"*.rpack 2>/dev/null || echo "No .rpack artifact found"
  artifacts:
    paths:
      - "*.rpack"
    when: always
    expire_in: 30 days
  rules:
    - if: $ISSUE_IID
      when: manual
      allow_failure: true
