stages:
  - test
  - build
  - publish
  - run

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# --- Test stage ---

test:
  stage: test
  image: python:3.11-slim
  cache:
    paths:
      - .pip-cache/
  before_script:
    - pip install -e ".[dev]"
  script:
    - python -m pytest tests/ -q --tb=short
    - python -m ruff check src/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Build Docker image ---

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Publish to AI Catalog ---

publish-agent:
  stage: publish
  image: alpine:latest
  script:
    - echo "Agent image published as $CI_REGISTRY_IMAGE:latest"
    - echo "Register in GitLab AI Catalog via Settings > AI Agents"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# --- Run ForgeProof pipeline (manual trigger with ISSUE_IID) ---

forgeproof-run:
  stage: run
  image: registry.gitlab.com/gitlab-ai-hackathon/participants/35326234:latest
  variables:
    GIT_STRATEGY: none
  script:
    - cd /app
    - python -m forgeproof.main run --issue-iid $ISSUE_IID --verbose --json
  artifacts:
    paths:
      - /app/*.rpack
    when: always
    expire_in: 30 days
  rules:
    - if: $ISSUE_IID
      when: manual
      allow_failure: true
